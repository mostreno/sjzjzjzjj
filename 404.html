<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | لحظة ميديا</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .err-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
  .err-code { font-size: 8rem; font-weight: 900; background: linear-gradient(135deg, #7c4dff, #b7a6ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
  .err-title { font-size: 1.75rem; font-weight: 700; margin: 1rem 0; color: #1a1a24; }
  .err-desc { color: #5c5c70; margin-bottom: 2rem; }
</style>
</head>
<body>
<div class="err-wrap">
  <div>
    <div class="err-code">404</div>
    <h1 class="err-title">الصفحة مش موجودة</h1>
    <p class="err-desc">يمكن الرابط قديم أو فيه غلطة</p>
    <a href="/" style="display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; background: #7c4dff; color: white; font-weight: 700; border-radius: 12px;">الرئيسية</a>
  </div>
</div>
</body>
</html>
